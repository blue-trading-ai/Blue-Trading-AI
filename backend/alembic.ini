# Blue-Trading-AI Alembic configuration
# Version 31 - Database Migration System

[alembic]

# Path to migration scripts.
script_location = %(here)s/migrations

# Add the backend root to Python's import path.
prepend_sys_path = .

# Use the operating system path separator.
path_separator = os

# Encoding used for generated migration files.
output_encoding = utf-8

# The actual database URL is loaded dynamically in migrations/env.py
# from app.database.connection.DATABASE_URL.
#
# This safe placeholder is required by Alembic's configuration parser,
# but migrations/env.py will replace it before connecting.
sqlalchemy.url = sqlite:///./blue_trading_ai.db


[post_write_hooks]
# Optional formatting hooks can be added later.


[loggers]
keys = root,sqlalchemy,alembic


[handlers]
keys = console


[formatters]
keys = generic


[logger_root]
level = WARNING
handlers = console
qualname =


[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine


[logger_alembic]
level = INFO
handlers =
qualname = alembic


[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic


[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
